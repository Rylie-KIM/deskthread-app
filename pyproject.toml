[project]
name = "deskthread"
version = "0.1.0"
description = "Local-first assistant that finds what a manager wrote down, without anything leaving the laptop."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pypdf>=5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pillow>=11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# The repo is an application, not a library: nothing is built or installed from it.
package = false
# Wheels only: no package may run its own build or install script on this machine (R8).
no-build = true
# Never fetch a Python interpreter; use the one already on the Mac.
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No .pytest_cache: the tools write nothing either (R4).
addopts = "-q -p no:cacheprovider --strict-markers -m 'not live'"
markers = [
    "live: touches the user's real Mac apps; run only on request with -m live (R1, R6)",
    "model: needs the local model server; skipped by make check",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["plan", "ui", "demo-laptop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "RUF", "SIM", "PTH"]
ignore = [
    "S101",  # assert is how pytest works
    "S105",  # false positives on enum values such as PASS and BAD_TOKEN
    "S603",  # subprocess calls are reviewed one by one (fixed argument lists, no shell)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"demo-data/content.py" = ["E501"]  # invented note text is kept as written

[tool.mypy]
python_version = "3.13"
strict = true
files = ["."]
exclude = ['^\.venv/', '^plan/', '^ui/', '^demo-laptop/', '^site/']
cache_dir = "/dev/null"
