[project]
name = "deskthread"
version = "0.1.0"
description = "Local-first assistant that finds what a manager wrote down, without anything leaving the laptop."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyobjc-framework-eventkit>=10",
    "pyobjc-framework-vision>=10",
    "pyobjc-framework-webkit>=10",
    "pypdf>=5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pillow>=11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# The repo is an application, not a library: nothing is built or installed from it.
package = false
# Wheels only: no package may run its own build or install script on this machine (R8).
no-build = true
# Never fetch a Python interpreter; use the one already on the Mac.
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No .pytest_cache: the tools write nothing either (R4).
addopts = "-q -p no:cacheprovider --strict-markers -m 'not live'"
markers = [
    "live: touches the user's real Mac apps; run only on request with -m live (R1, R6)",
    "model: needs the local model server; skipped by make check",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["plan", "ui", "demo-laptop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "RUF", "SIM", "PTH"]
ignore = [
    "S101",  # assert is how pytest works
    "S105",  # false positives on enum values such as PASS and BAD_TOKEN
    "S603",  # subprocess calls are reviewed one by one (fixed argument lists, no shell)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tests/unit/test_mac_apps.py" = ["S105", "S106", "S108", "E501"]  # canned app replies, kept on one line each
"app/sources/mac.py" = ["E501"]  # AppleScript text is kept one statement per line
"scripts/seed/*.py" = ["E501", "S603", "S607", "UP031"]
"scripts/demo_preflight.py" = ["E501", "S603", "S607"]  # one check per line; fixed system tools  # demo text is one line per note line; fixed osascript calls
"app/icons.py" = ["E501"]  # one very long method name from Apple's frameworks
"app/window.py" = ["N802"]  # method names are dictated by Apple's frameworks
"demo-data/content.py" = ["E501"]  # invented note text is kept as written
"demo-data/content_more.py" = ["E501"]  # invented note text is kept as written

[tool.mypy]
python_version = "3.13"
strict = true
files = ["."]
exclude = ['^\.venv/', '^plan/', '^ui/', '^demo-laptop/', '^site/']
cache_dir = "/dev/null"

# Apple's frameworks through pyobjc have no type stubs; the window module subclasses NSObject.
[[tool.mypy.overrides]]
module = ["AppKit", "Foundation", "WebKit", "objc", "PyObjCTools", "EventKit", "Vision"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.window", "app.icons"]
disallow_subclassing_any = false
disallow_untyped_calls = false
