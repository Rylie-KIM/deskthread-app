<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafe"/><stop offset=".55" stop-color="#e9f0fb"/><stop offset="1" stop-color="#d6e6fa"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ad8ff" stop-opacity=".0"/><stop offset=".5" stop-color="#2f9bff" stop-opacity=".35"/><stop offset="1" stop-color="#0a17c4" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".82"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="glassStrong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#eef3ff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="royal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a46e0"/><stop offset="1" stop-color="#0a17c4"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2846a0" flood-opacity=".22"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#2846a0" flood-opacity=".2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0a17c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="260" cy="120" rx="320" ry="90" fill="#8ad8ff" opacity=".55" transform="rotate(-8 260 120)"/>
    <ellipse cx="1150" cy="330" rx="360" ry="120" fill="#2f9bff" opacity=".28" transform="rotate(10 1150 330)"/>
    <ellipse cx="400" cy="640" rx="380" ry="90" fill="#b9c8ff" opacity=".6" transform="rotate(6 400 640)"/>
  </g>
  <path d="M-40 520 C 300 380, 600 640, 1000 470 S 1300 330, 1460 380" fill="none" stroke="url(#ribbon)" stroke-width="70" stroke-linecap="round" opacity=".6"/>

  <!-- Row 1: the path of a question -->
  <g filter="url(#shadowSm)">
    <rect x="60"   y="60" width="275" height="120" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="1.5"/>
    <rect x="395"  y="60" width="275" height="120" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="1.5"/>
    <rect x="730"  y="60" width="275" height="120" rx="28" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
    <rect x="1065" y="60" width="275" height="120" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="1.5"/>
  </g>
  <g fill="#0b1640" font-size="25" font-weight="700">
    <text x="88"   y="112">Mac window</text>
    <text x="423"  y="112">Page</text>
    <text x="758"  y="112">Backend</text>
    <text x="1093" y="112">Model server</text>
  </g>
  <g fill="#4a5682" font-size="17">
    <text x="88"   y="144">WebKit, nothing kept on disk</text>
    <text x="423"  y="144">React, static screens</text>
    <text x="758"  y="144">Python, 127.0.0.1 only</text>
    <text x="1093" y="144">Ollama, 127.0.0.1 only</text>
  </g>
  <g stroke="#0a17c4" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="347" y1="120" x2="383" y2="120" marker-end="url(#arrow)"/>
    <line x1="682" y1="120" x2="718" y2="120" marker-end="url(#arrow)"/>
    <line x1="1017" y1="120" x2="1053" y2="120" marker-end="url(#arrow)"/>
  </g>

  <!-- connector backend -> gates -->
  <line x1="867" y1="180" x2="867" y2="262" stroke="#0a17c4" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 9"/>

  <!-- Gates panel: the point of the design -->
  <g filter="url(#shadow)">
    <rect x="60" y="262" width="1280" height="268" rx="36" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="95" y="312" fill="#0b1640" font-size="28" font-weight="700">Four gates</text>
  <text x="257" y="312" fill="#4a5682" font-size="19">between your files and every answer</text>

  <g filter="url(#shadowSm)">
    <rect x="85"   y="340" width="285" height="160" rx="26" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
    <rect x="400"  y="340" width="285" height="160" rx="26" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
    <rect x="715"  y="340" width="285" height="160" rx="26" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
    <rect x="1030" y="340" width="285" height="160" rx="26" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadowSm)">
    <rect x="105"  y="360" width="52" height="34" rx="17" fill="url(#royal)"/>
    <rect x="420"  y="360" width="52" height="34" rx="17" fill="url(#royal)"/>
    <rect x="735"  y="360" width="52" height="34" rx="17" fill="url(#royal)"/>
    <rect x="1050" y="360" width="52" height="34" rx="17" fill="url(#royal)"/>
  </g>
  <g fill="#fff" font-size="17" font-weight="700" text-anchor="middle">
    <text x="131"  y="383">G1</text>
    <text x="446"  y="383">G2</text>
    <text x="761"  y="383">G3</text>
    <text x="1076" y="383">G4</text>
  </g>
  <g fill="#0b1640" font-size="23" font-weight="700">
    <text x="105"  y="432">What may be read</text>
    <text x="420"  y="432">Read</text>
    <text x="735"  y="432">Model</text>
    <text x="1050" y="432">Answer check</text>
  </g>
  <g fill="#4a5682" font-size="16">
    <text x="105"  y="462">Only sources that are On</text>
    <text x="105"  y="483">Nothing outside your choice</text>
    <text x="420"  y="462">Counted, never skipped</text>
    <text x="420"  y="483">in silence</text>
    <text x="735"  y="462">Local model, no tools</text>
    <text x="735"  y="483">Its text is never run</text>
    <text x="1050" y="462">Quote copied by code</text>
    <text x="1050" y="483">Not found if nothing fits</text>
  </g>
  <g stroke="#0a17c4" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="376" y1="420" x2="394" y2="420" marker-end="url(#arrow)"/>
    <line x1="691" y1="420" x2="709" y2="420" marker-end="url(#arrow)"/>
    <line x1="1006" y1="420" x2="1024" y2="420" marker-end="url(#arrow)"/>
  </g>

  <!-- connector gates -> files -->
  <line x1="700" y1="530" x2="700" y2="592" stroke="#0a17c4" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 9"/>

  <!-- Files -->
  <g filter="url(#shadowSm)">
    <rect x="60" y="592" width="1280" height="110" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="1.5"/>
  </g>
  <text x="95" y="640" fill="#0b1640" font-size="25" font-weight="700">Your files and Mac apps</text>
  <text x="95" y="672" fill="#4a5682" font-size="17">Notes, Calendar, Mail, Reminders and folders</text>
  <g filter="url(#shadowSm)">
    <rect x="1010" y="628" width="140" height="40" rx="20" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
    <rect x="1166" y="628" width="150" height="40" rx="20" fill="url(#glassStrong)" stroke="#fff" stroke-width="1.5"/>
  </g>
  <g fill="#0a17c4" font-size="16" font-weight="700" text-anchor="middle">
    <text x="1080" y="654">Read only</text>
    <text x="1241" y="654">Held in memory</text>
  </g>
</svg>
